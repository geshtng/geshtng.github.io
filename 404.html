<!DOCTYPE html>
<html lang="en" data-time="night">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station not found · geshtng</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .lost {
            width: min(560px, 100%);
        }

        .lost img {
            display: block;
            width: 96px;
            margin: 0 auto 24px;
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <main class="lost">
        <img src="/assets/favicon.svg" alt="" width="96" height="96">
        <article class="stop" style="--line:#e2231a">
            <header class="sign">
                <span class="sign-number">404</span>
                <p class="sign-kana" lang="ja">回送</p>
                <h1 class="sign-name">This station doesn't exist</h1>
                <p class="sign-sub">The train you're looking for isn't running on this line</p>
                <div class="sign-stripe"></div>
                <p class="sign-next"><a href="/">← Back to the start</a><span lang="ja">終点</span></p>
            </header>
            <div class="stop-body">
                <p>The page may have moved, or the link has a typo. Hop back on at
                    <a href="/">geshtng.github.io</a>.</p>
            </div>
        </article>
    </main>
</body>

</html>
